<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
<title id="title">Knowledgeable-R1: learn from three views of the same question</title>
<desc id="desc">Left: PK generates an answer from the question; CK generates with context; RPK scores the same PK answer under context. Rewards are compared jointly. Right: Table 2, Qwen2.5-7B-Instruct on ConFiQA-MC with incorrect context: query only 25.82%, RAG 8.06%, GRPO with RAG 19.74%, Knowledgeable-R1 37.34%.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8aa5b7"/></marker></defs>
<rect width="1180" height="520" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="41" fill="#253d4e" font-size="26" font-weight="normal" text-anchor="start">One question. Three training views.</text>
<text x="30" y="72" fill="#627785" font-size="16" font-weight="normal" text-anchor="start">Learn how to use knowledge under different evidence conditions.</text>
<line x1="752" y1="27" x2="752" y2="472" stroke="#d8e3eb" stroke-width="1"/>
<rect x="30" y="106" width="49" height="49" rx="24.5" fill="#0076df" fill-opacity=".09"/>
<text x="54.5" y="136" fill="#0076df" font-size="15" font-weight="bold" text-anchor="middle">PK</text>
<text x="96" y="131" fill="#253d4e" font-size="18" font-weight="normal" text-anchor="start">Question</text>
<text x="96" y="159" fill="#627785" font-size="15" font-weight="normal" text-anchor="start">Sample a parametric answer</text>
<line x1="363" y1="135" x2="446" y2="135" stroke="#8aa5b7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="205" width="49" height="49" rx="24.5" fill="#628d9f" fill-opacity=".09"/>
<text x="54.5" y="235" fill="#628d9f" font-size="15" font-weight="bold" text-anchor="middle">CK</text>
<text x="96" y="230" fill="#253d4e" font-size="18" font-weight="normal" text-anchor="start">Question + context</text>
<text x="96" y="258" fill="#627785" font-size="15" font-weight="normal" text-anchor="start">Sample a context-aware answer</text>
<line x1="363" y1="234" x2="446" y2="234" stroke="#8aa5b7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="304" width="49" height="49" rx="24.5" fill="#377c70" fill-opacity=".09"/>
<text x="54.5" y="334" fill="#377c70" font-size="15" font-weight="bold" text-anchor="middle">RPK</text>
<text x="96" y="329" fill="#253d4e" font-size="18" font-weight="normal" text-anchor="start">Question + context</text>
<text x="96" y="357" fill="#627785" font-size="15" font-weight="normal" text-anchor="start">Score the same PK answer</text>
<line x1="363" y1="333" x2="446" y2="333" stroke="#8aa5b7" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M453 135 L475 135 L475 333 L453 333" fill="none" stroke="#8aa5b7" stroke-width="1.5"/>
<text x="502" y="196" fill="#253d4e" font-size="20" font-weight="normal" text-anchor="start">Compare rewards</text>
<text x="502" y="226" fill="#627785" font-size="16" font-weight="normal" text-anchor="start">Local + global</text>
<text x="502" y="250" fill="#627785" font-size="16" font-weight="normal" text-anchor="start">advantages</text>
<line x1="578" y1="271" x2="578" y2="305" stroke="#8aa5b7" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="502" y="338" fill="#0076df" font-size="19" font-weight="normal" text-anchor="start">Update the policy</text>
<line x1="30" y1="397" x2="710" y2="397" stroke="#d8e3eb" stroke-width="1"/>
<text x="30" y="433" fill="#0076df" font-size="20" font-weight="normal" text-anchor="start">Use helpful evidence. Resist misleading context.</text>
<text x="30" y="465" fill="#627785" font-size="13" font-weight="normal" text-anchor="start">RPK reuses the PK trajectory; it does not sample a separate answer.</text>
<text x="792" y="41" fill="#253d4e" font-size="24" font-weight="normal" text-anchor="start">When the context is wrong</text>
<text x="792" y="72" fill="#627785" font-size="15" font-weight="normal" text-anchor="start">Qwen2.5-7B-Instruct / ConFiQA-MC</text>
<text x="792" y="97" fill="#627785" font-size="14" font-weight="normal" text-anchor="start">Accuracy (%) · Table 2, scenario S2</text>
<line x1="810" y1="391.0" x2="1145" y2="391.0" stroke="#d8e3eb" stroke-width="1"/>
<text x="801" y="396.0" fill="#627785" font-size="12" font-weight="normal" text-anchor="end">0</text>
<line x1="810" y1="268.0" x2="1145" y2="268.0" stroke="#d8e3eb" stroke-width="1"/>
<text x="801" y="273.0" fill="#627785" font-size="12" font-weight="normal" text-anchor="end">20</text>
<line x1="810" y1="145.0" x2="1145" y2="145.0" stroke="#d8e3eb" stroke-width="1"/>
<text x="801" y="150.0" fill="#627785" font-size="12" font-weight="normal" text-anchor="end">40</text>
<rect x="824" y="232.207" width="44" height="158.793" fill="#8aa5b7" rx="2"/>
<text x="846" y="219.20700000000002" fill="#8aa5b7" font-size="19" font-weight="bold" text-anchor="middle">25.82</text>
<text x="846" y="419" fill="#253d4e" font-size="12" font-weight="normal" text-anchor="middle">Query</text>
<text x="846" y="438" fill="#253d4e" font-size="12" font-weight="normal" text-anchor="middle">only</text>
<rect x="906" y="341.431" width="44" height="49.569" fill="#ad654d" rx="2"/>
<text x="928" y="328.431" fill="#ad654d" font-size="19" font-weight="bold" text-anchor="middle">8.06</text>
<text x="928" y="419" fill="#253d4e" font-size="12" font-weight="normal" text-anchor="middle">RAG</text>
<text x="928" y="438" fill="#253d4e" font-size="12" font-weight="normal" text-anchor="middle"></text>
<rect x="988" y="269.599" width="44" height="121.401" fill="#607b8c" rx="2"/>
<text x="1010" y="256.59900000000005" fill="#607b8c" font-size="19" font-weight="bold" text-anchor="middle">19.74</text>
<text x="1010" y="419" fill="#253d4e" font-size="12" font-weight="normal" text-anchor="middle">GRPO</text>
<text x="1010" y="438" fill="#253d4e" font-size="12" font-weight="normal" text-anchor="middle">w/ RAG</text>
<rect x="1070" y="161.359" width="44" height="229.641" fill="#0076df" rx="2"/>
<text x="1092" y="148.35899999999998" fill="#0076df" font-size="19" font-weight="bold" text-anchor="middle">37.34</text>
<text x="1092" y="419" fill="#253d4e" font-size="12" font-weight="normal" text-anchor="middle">Knowledgeable</text>
<text x="1092" y="438" fill="#253d4e" font-size="12" font-weight="normal" text-anchor="middle">-R1</text>
<text x="792" y="479" fill="#627785" font-size="12" font-weight="normal" text-anchor="start">A result for this test setting, not a universal guarantee.</text>
</g></svg>
