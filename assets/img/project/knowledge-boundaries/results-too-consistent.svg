<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Self-consistent errors are harder to detect</title>
<desc id="desc">Five error-detection methods on Qwen2.5-7B-Instruct and TriviaQA. Blue points show AUROC on inconsistent errors and rust points on self-consistent errors, using the same 0.4 to 1.0 scale. Semantic entropy falls from 0.9119 to 0.4453. Source: Table 2, Too Consistent to Detect, EMNLP 2025.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1100" height="560" fill="#ffffff" rx="4"/>
<text x="28.000" y="40" font-size="28" fill="#223746" font-weight="normal" text-anchor="start">Self-consistent errors are harder to detect</text>
<text x="28.000" y="69" font-size="16" fill="#607180" font-weight="normal" text-anchor="start">Qwen2.5-7B-Instruct / TriviaQA</text>
<circle cx="306.000" cy="106" r="5" fill="#0076df" stroke="#fff" stroke-width="1.5"/>
<text x="320.000" y="112" font-size="16" fill="#0076df" font-weight="normal" text-anchor="start">Inconsistent errors</text>
<circle cx="590.000" cy="106" r="5" fill="#ad654d" stroke="#fff" stroke-width="1.5"/>
<text x="604.000" y="112" font-size="16" fill="#ad654d" font-weight="normal" text-anchor="start">Self-consistent errors</text>
<line x1="305.000" y1="136" x2="305.000" y2="475" stroke="#dde5eb" stroke-width="1"/>
<text x="305.000" y="502" font-size="15" fill="#607180" font-weight="normal" text-anchor="middle">0.4</text>
<line x1="429.167" y1="136" x2="429.167" y2="475" stroke="#607180" stroke-width="1.4" stroke-dasharray="5 6"/>
<text x="429.167" y="502" font-size="15" fill="#607180" font-weight="normal" text-anchor="middle">0.5</text>
<line x1="553.333" y1="136" x2="553.333" y2="475" stroke="#dde5eb" stroke-width="1"/>
<text x="553.333" y="502" font-size="15" fill="#607180" font-weight="normal" text-anchor="middle">0.6</text>
<line x1="677.500" y1="136" x2="677.500" y2="475" stroke="#dde5eb" stroke-width="1"/>
<text x="677.500" y="502" font-size="15" fill="#607180" font-weight="normal" text-anchor="middle">0.7</text>
<line x1="801.667" y1="136" x2="801.667" y2="475" stroke="#dde5eb" stroke-width="1"/>
<text x="801.667" y="502" font-size="15" fill="#607180" font-weight="normal" text-anchor="middle">0.8</text>
<line x1="925.833" y1="136" x2="925.833" y2="475" stroke="#dde5eb" stroke-width="1"/>
<text x="925.833" y="502" font-size="15" fill="#607180" font-weight="normal" text-anchor="middle">0.9</text>
<line x1="1050.000" y1="136" x2="1050.000" y2="475" stroke="#dde5eb" stroke-width="1"/>
<text x="1050.000" y="502" font-size="15" fill="#607180" font-weight="normal" text-anchor="middle">1.0</text>
<text x="28.000" y="169" font-size="18" fill="#223746" font-weight="normal" text-anchor="start">Token probability</text>
<text x="28.000" y="190" font-size="12" fill="#607180" font-weight="normal" text-anchor="start">Training-free</text>
<line x1="473.867" y1="170" x2="695.877" y2="170" stroke="#c8d5df" stroke-width="3"/>
<circle cx="695.877" cy="170" r="6" fill="#0076df" stroke="#fff" stroke-width="1.5"/>
<circle cx="473.867" cy="170" r="6" fill="#ad654d" stroke="#fff" stroke-width="1.5"/>
<text x="695.877" y="156" font-size="15" fill="#0076df" font-weight="normal" text-anchor="middle">0.7148</text>
<text x="473.867" y="197" font-size="15" fill="#ad654d" font-weight="normal" text-anchor="middle">0.5360</text>
<text x="28.000" y="239" font-size="18" fill="#223746" font-weight="normal" text-anchor="start">P(True)</text>
<text x="28.000" y="260" font-size="12" fill="#607180" font-weight="normal" text-anchor="start">Training-free</text>
<line x1="736.852" y1="240" x2="847.981" y2="240" stroke="#c8d5df" stroke-width="3"/>
<circle cx="847.981" cy="240" r="6" fill="#0076df" stroke="#fff" stroke-width="1.5"/>
<circle cx="736.852" cy="240" r="6" fill="#ad654d" stroke="#fff" stroke-width="1.5"/>
<text x="847.981" y="226" font-size="15" fill="#0076df" font-weight="normal" text-anchor="middle">0.8373</text>
<text x="736.852" y="267" font-size="15" fill="#ad654d" font-weight="normal" text-anchor="middle">0.7478</text>
<rect x="17" y="278" width="1066" height="66" fill="#fbf3ef" rx="4"/>
<line x1="429.167" y1="278" x2="429.167" y2="344" stroke="#607180" stroke-width="1.4" stroke-dasharray="5 6"/>
<text x="28.000" y="309" font-size="18" fill="#ad654d" font-weight="bold" text-anchor="start">Semantic entropy</text>
<text x="28.000" y="330" font-size="12" fill="#607180" font-weight="normal" text-anchor="start">Training-free</text>
<line x1="361.247" y1="310" x2="940.609" y2="310" stroke="#c8d5df" stroke-width="3"/>
<circle cx="940.609" cy="310" r="6" fill="#0076df" stroke="#fff" stroke-width="1.5"/>
<circle cx="361.247" cy="310" r="6" fill="#ad654d" stroke="#fff" stroke-width="1.5"/>
<text x="940.609" y="296" font-size="15" fill="#0076df" font-weight="normal" text-anchor="middle">0.9119</text>
<text x="361.247" y="337" font-size="15" fill="#ad654d" font-weight="normal" text-anchor="middle">0.4453</text>
<text x="28.000" y="379" font-size="18" fill="#223746" font-weight="normal" text-anchor="start">Probe (in-domain)</text>
<text x="28.000" y="400" font-size="12" fill="#607180" font-weight="normal" text-anchor="start">Supervised</text>
<line x1="879.395" y1="380" x2="983.819" y2="380" stroke="#c8d5df" stroke-width="3"/>
<circle cx="983.819" cy="380" r="6" fill="#0076df" stroke="#fff" stroke-width="1.5"/>
<circle cx="879.395" cy="380" r="6" fill="#ad654d" stroke="#fff" stroke-width="1.5"/>
<text x="983.819" y="366" font-size="15" fill="#0076df" font-weight="normal" text-anchor="middle">0.9467</text>
<text x="879.395" y="407" font-size="15" fill="#ad654d" font-weight="normal" text-anchor="middle">0.8626</text>
<text x="28.000" y="449" font-size="18" fill="#223746" font-weight="normal" text-anchor="start">Probe + cross-model</text>
<text x="28.000" y="470" font-size="12" fill="#607180" font-weight="normal" text-anchor="start">Supervised</text>
<line x1="936.760" y1="450" x2="1012.253" y2="450" stroke="#c8d5df" stroke-width="3"/>
<circle cx="1012.253" cy="450" r="6" fill="#0076df" stroke="#fff" stroke-width="1.5"/>
<circle cx="936.760" cy="450" r="6" fill="#ad654d" stroke="#fff" stroke-width="1.5"/>
<text x="1012.253" y="436" font-size="15" fill="#0076df" font-weight="normal" text-anchor="middle">0.9696</text>
<text x="936.760" y="477" font-size="15" fill="#ad654d" font-weight="normal" text-anchor="middle">0.9088</text>
<text x="28.000" y="540" font-size="14" fill="#607180" font-weight="normal" text-anchor="start">AUROC: higher is better</text>
<text x="429.167" y="540" font-size="14" fill="#607180" font-weight="normal" text-anchor="middle">0.5 = chance</text>
<text x="1072.000" y="540" font-size="13" fill="#607180" font-weight="normal" text-anchor="end">Table 2 / EMNLP 2025</text>
</g></svg>
