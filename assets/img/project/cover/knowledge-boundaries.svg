<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-labelledby="title description">
  <title id="title">From latent knowledge to reliable answers</title>
  <desc id="description">A conceptual illustration in three connected stages: access latent facts, assess an answer against a reference signal, and choose to answer, seek evidence, or abstain. Shapes are illustrative, not experimental measurements.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#f0f6fb"/><stop offset="1" stop-color="#eaf2f5"/></linearGradient>
    <linearGradient id="thread" x1="100" y1="430" x2="1090" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#0076df"/><stop offset="1" stop-color="#438a8d"/></linearGradient>
    <linearGradient id="halo" x1="155" y1="350" x2="425" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#c7dceb" stop-opacity=".2"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.3" refY="3.5" orient="auto"><path d="M1 1L5.5 3.5L1 6" stroke="#6d98b4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="900" rx="8" fill="url(#paper)"/>
  <path d="M64 85H1136M64 814H1136" stroke="#c4d5e1"/>
  <g fill="#526b7e" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2.5"><text x="66" y="58">KNOWLEDGE BOUNDARIES</text><text x="1134" y="58" text-anchor="end">STAR / 2024–2026</text></g>
  <text x="67" y="164" fill="#29485f" font-family="Georgia, 'Times New Roman', serif" font-size="35" letter-spacing="-.8">What a model knows.</text>
  <text x="67" y="207" fill="#0076df" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-style="italic" letter-spacing="-.8">What it should say.</text>
  <g stroke="#c4d5e1" stroke-dasharray="2 9"><path d="M443 313V663"/><path d="M784 313V663"/></g>
  <g fill="#a7c2d7" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic"><text x="76" y="302">01</text><text x="473" y="302">02</text><text x="817" y="302">03</text></g>
  <!-- A diffuse field of fact fragments, only some of which are readily accessible. -->
  <path d="M114 431C105 332 230 316 319 346C410 376 432 486 386 561C337 644 206 633 143 568C112 537 109 483 114 431Z" fill="url(#halo)" stroke="#b9cedd" stroke-width="1.5" stroke-dasharray="4 9"/>
  <path d="M145 423C151 371 230 353 290 376C354 401 380 465 356 520C329 581 239 593 183 547" stroke="#c2d8e6" stroke-width="1.3"/>
  <g fill="#b1c9da" fill-opacity=".66">
    <rect x="141" y="389" width="50" height="15" rx="5"/>
    <rect x="227" y="356" width="44" height="15" rx="5"/>
    <rect x="317" y="404" width="47" height="15" rx="5"/>
    <rect x="169" y="460" width="42" height="15" rx="5"/>
    <rect x="253" y="417" width="37" height="15" rx="5"/>
    <rect x="329" y="491" width="39" height="15" rx="5"/>
    <rect x="142" y="530" width="48" height="15" rx="5"/>
    <rect x="221" y="567" width="44" height="15" rx="5"/>
    <rect x="289" y="548" width="39" height="15" rx="5"/>
  </g>
  <g stroke="#b8cfdf" stroke-width="1.2"><path d="M167 404L190 460M271 365L330 403M271 432L328 491M192 536L228 570"/></g>
  <rect x="228" y="480" width="70" height="24" rx="7" fill="#0076df"/>
  <rect x="220" y="472" width="86" height="40" rx="12" stroke="#0076df" stroke-opacity=".38" stroke-width="1.5"/>
  <path d="M306 492H416C462 492 459 465 493 465H514" stroke="url(#thread)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="417" cy="492" r="4" fill="#0076df"/>
  <!-- Assess an answer using a separate reference; no numeric scores are implied. -->
  <rect x="528" y="380" width="167" height="214" rx="83.5" fill="#fff" fill-opacity=".55" stroke="#a8c5d9" stroke-width="1.5"/>
  <rect x="547" y="402" width="129" height="170" rx="64.5" stroke="#d1e1eb"/>
  <path d="M553 460H670M553 512H670" stroke="#d4e2eb"/>
  <g stroke="#c0d3e1" stroke-width="1.2"><path d="M572 420V553M611 408V566M650 420V553"/></g>
  <path d="M569 524L592 500L615 481L650 446" stroke="#0076df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M570 535L591 507L617 489L650 459" stroke="#5b9292" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <g fill="#0076df" stroke="#f2f7fa" stroke-width="2"><circle cx="569" cy="524" r="5"/><circle cx="592" cy="500" r="5"/><circle cx="615" cy="481" r="5"/><circle cx="650" cy="446" r="5"/></g>
  <path d="M611 351V380" stroke="#5b9292" stroke-width="1.8"/>
  <circle cx="611" cy="342" r="8" fill="#5b9292"/>
  <path d="M695 487H772C805 487 805 415 836 415H861M772 487H861M772 487C805 487 805 559 836 559H861" stroke="url(#thread)" stroke-width="2.3"/>
  <circle cx="772" cy="487" r="4" fill="#438a8d"/>
  <!-- A common knowledge thread supports several appropriate actions. -->
  <g stroke-width="1.5">
    <circle cx="887" cy="415" r="22" fill="#e3f0f0" stroke="#78a4a2"/>
    <path d="M877 415L884 422L898 407" stroke="#3f7f7e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="887" cy="487" r="22" fill="#e2edf6" stroke="#7ca7c7"/>
    <path d="M878 487H896M887 478V496" stroke="#497eaa" stroke-width="2" stroke-linecap="round"/>
    <circle cx="887" cy="559" r="22" fill="#f2ece7" stroke="#be9b85"/>
    <path d="M879 559H895" stroke="#a16f54" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g fill="#345970" font-family="Arial, Helvetica, sans-serif" font-size="22"><text x="925" y="423">Answer</text><text x="925" y="495">Seek evidence</text><text x="925" y="567">Abstain</text></g>
  <path d="M925 436H1066M925 508H1092M925 580H1057" stroke="#c8d9e4"/>
  <g fill="#33556b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="2.3"><text x="258" y="706" text-anchor="middle">ACCESS</text><text x="611" y="706" text-anchor="middle">ASSESS</text><text x="969" y="706" text-anchor="middle">ACT</text></g>
  <g fill="#647e90" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle"><text x="258" y="740">Bring knowledge to the surface.</text><text x="611" y="740">Judge its reliability.</text><text x="969" y="740">Choose how to respond.</text></g>
  <g fill="#647e90" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2"><text x="66" y="854">FROM LATENT KNOWLEDGE TO RELIABLE ANSWERS</text><text x="1134" y="854" text-anchor="end">A RESEARCH THREAD</text></g>
</svg>
